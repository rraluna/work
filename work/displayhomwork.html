<!DOCTYPE html>
<html>

<head>
    <title>Display Homework</title>
    <style>
        .name,
        .email {
            display: block;
            margin-bottom: 10px;
        }

        .massege {
            display: inline;
            height: 30px;
            width: 10px;
            font-size: 20px;
            font-weight: bold;
            color: black;
            vertical-align: middle;
        }

        .YES,
        .NO {
            display: inline-block;
            width: 30px;
            object-fit: contain;
            object-position: right;

        }
    </style>
</head>

<body>

    <input class="name" type="text" placeholder="Name">
    <input class="email" type="text" placeholder="email">
    <p class="massege">
        Thanks for chatting with our customer suppurt. Would you like to take our quick survey?
    </p>
    <input class="YES" type="text" placeholder="Yes">
    <input class="NO" type="text" placeholder="No">
</body>

</html>
